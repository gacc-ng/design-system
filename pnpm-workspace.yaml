packages:
    - 'apps/*'
    - 'libs/**'

autoInstallPeers: true
allowBuilds:
    nx: true
    esbuild: false
    lmdb: false
    msgpackr-extract: false
    '@parcel/watcher': false
    lefthook: true
    '@swc/core': false
    unrs-resolver: false
minimumReleaseAgeExclude:
    - '@spartan-ng/brain@1.9.0'
    - '@spartan-ng/cli@1.9.0'
