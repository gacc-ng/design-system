name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    actions: read
    contents: read
    pull-requests: read

jobs:
    quality-gate:
        name: Lint, Format, Test & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup workspace
              uses: ./.github/actions/setup

            - name: Determine base and head commits
              id: set-shas
              uses: nrwl/nx-set-shas@v5

            - name: Validate Conventional Commits
              if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/')
              run: pnpm exec commitlint --config commitlint.config.ts --from ${{ steps.set-shas.outputs.base }} --to ${{ steps.set-shas.outputs.head }}

            - name: Verify code formatting
              run: pnpm nx format:check --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }}

            - name: Execute affected quality gates
              run: pnpm nx affected -t lint test build test-schematics validate-package build-storybook --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }}

            - name: Upload library distribution artifact
              if: hashFiles('dist/libs/ui/package.json') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: gacc-ng-ui-dist
                  path: dist/libs/ui
                  retention-days: 7
