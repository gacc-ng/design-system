name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    actions: read
    contents: read
    pull-requests: read

jobs:
    quality-gate:
        name: Lint, Format, Test & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Determine base and head commits
              id: set-shas
              uses: nrwl/nx-set-shas@v5

            - name: Validate Conventional Commits
              if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/')
              run: pnpm exec commitlint --config commitlint.config.ts --from ${{ steps.set-shas.outputs.base }} --to ${{ steps.set-shas.outputs.head }}

            - name: Verify code formatting
              run: pnpm nx format:check --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }}

            - name: Lint affected projects
              run: pnpm nx affected -t lint --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }}

            - name: Run unit tests on affected projects
              run: pnpm nx affected -t test --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }}

            - name: Build affected projects
              run: pnpm nx affected -t build --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }}

            - name: Run schematics unit tests
              if: hashFiles('dist/libs/shared/ui/schematics/collection.json') != ''
              run: pnpm nx run ui:test-schematics

            - name: Validate library package integrity
              if: hashFiles('dist/libs/shared/ui/package.json') != ''
              run: |
                  echo "Validating @gacc-ng/ui package..."
                  cd dist/libs/shared/ui
                  pnpm pack --dry-run
                  test -f package.json
                  test -f src/styles/preset.css
                  test -f schematics/collection.json
                  test -d button && test -d badge && test -d input && test -d label && test -d utils
                  echo "Library package structure and entry points verified successfully!"

            - name: Upload library distribution artifact
              if: hashFiles('dist/libs/shared/ui/package.json') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: gacc-ng-ui-dist
                  path: dist/libs/shared/ui
                  retention-days: 7
