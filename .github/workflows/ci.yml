name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    actions: read
    contents: read
    pull-requests: read

jobs:
    quality-gate:
        name: Lint, Format, Test & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Determine base and head commits
              id: set-shas
              uses: nrwl/nx-set-shas@v4

            - name: Validate Conventional Commits
              if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/')
              run: pnpm exec commitlint --config commitlint.config.ts --from ${{ steps.set-shas.outputs.base }} --to ${{ steps.set-shas.outputs.head }}

            - name: Verify code formatting
              run: pnpm nx format:check --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }}

            - name: Lint affected projects
              run: pnpm nx affected -t lint --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }}

            - name: Run unit tests on affected projects
              run: pnpm nx affected -t test --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }}

            - name: Build affected projects
              run: pnpm nx affected -t build --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }}
