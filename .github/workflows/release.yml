name: Release & Publish

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Optional git tag to re-publish (leave empty for standard Release Please run)'
                required: false
                type: string
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-please:
        name: Release Please (PR & Tag)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag_name == '' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: Run Release Please
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        name: Publish to GitHub Packages
        needs: release-please
        if: ${{ always() && (needs.release-please.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')) }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            LEFTHOOK: '0'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.tag_name || needs.release-please.outputs.tag_name || 'main' }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@gacc-ng'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Library
              run: pnpm nx build ui

            - name: Validate Package
              run: pnpm nx run ui:validate-package

            - name: Publish to GitHub Packages
              run: pnpm publish dist/libs/ui --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
