name: Release & Publish

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Optional git tag to re-publish (leave empty for standard Release Please run)'
                required: false
                type: string
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release-please:
        name: Release Please (PR & Tag)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag_name == '' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: Run Release Please
              id: release
              uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        name: Publish to GitHub Packages
        needs: release-please
        if: ${{ always() && (needs.release-please.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')) }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            LEFTHOOK: '0'
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.tag_name || needs.release-please.outputs.tag_name || 'main' }}

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@gacc-ng'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Library
              run: pnpm nx build ui

            - name: Validate Package
              run: pnpm nx run ui:validate-package

            - name: Publish to GitHub Packages
              run: pnpm publish dist/libs/ui --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
