version: 2
updates:
    # 1. Monorepo Dependencies (pnpm / npm ecosystem)
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '04:00'
          timezone: 'America/Lima'
      open-pull-requests-limit: 10
      target-branch: 'main'
      labels:
          - 'dependencies'
          - 'automated-pr'
      groups:
          angular-framework:
              patterns:
                  - '@angular/*'
                  - '@angular-devkit/*'
                  - '@schematics/*'
                  - 'angular-eslint'
                  - '@angular-eslint/*'
                  - 'ng-packagr'
                  - 'zone.js'
                  - 'rxjs'
          spartan-ui:
              patterns:
                  - '@spartan-ng/*'
                  - 'spartan-ng'
          nx-ecosystem:
              patterns:
                  - '@nx/*'
                  - 'nx'
                  - '@swc/*'
          testing:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
                  - 'jsdom'
                  - '@types/chai'
                  - 'chai'
          linting-and-quality:
              patterns:
                  - '*eslint*'
                  - '*prettier*'
                  - '@typescript-eslint/*'
                  - 'commitlint*'
                  - '@commitlint/*'
                  - 'typescript-eslint'
                  - 'typescript'
                  - 'tslib'
                  - 'lefthook'
          ui-styling:
              patterns:
                  - 'tailwindcss'
                  - '@tailwindcss/*'
                  - 'postcss'
                  - 'autoprefixer'
                  - 'clsx'
                  - 'tailwind-merge'
                  - 'class-variance-authority'
                  - 'tw-animate-css'
      ignore:
          - dependency-name: 'typescript'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: 'nx'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@nx/*'
            update-types:
                - 'version-update:semver-major'

    # 2. GitHub Actions Workflows
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '04:00'
          timezone: 'America/Lima'
      open-pull-requests-limit: 5
      labels:
          - 'ci/cd'
          - 'dependencies'
          - 'automated-pr'
      groups:
          github-actions-workflows:
              patterns:
                  - '*'
