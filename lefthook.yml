# Lefthook configuration for Nx Monorepo
pre-commit:
    parallel: false
    commands:
        prettier:
            glob: '*.{ts,js,html,css,scss,json,md,yml,yaml}'
            run: pnpm exec prettier --write {staged_files}
            stage_fixed: true
        eslint:
            glob: '*.{ts,js,html}'
            run: pnpm exec eslint --fix {staged_files}
            stage_fixed: true

commit-msg:
    commands:
        commitlint:
            run: pnpm exec commitlint --config commitlint.config.ts --edit {1}

pre-push:
    commands:
        prevent-main-push:
            run: |
                branch=$(git symbolic-ref --short HEAD 2>/dev/null || echo "")
                if [ "$CI" != "true" ] && [ "$branch" = "main" ]; then
                  echo "❌ Direct push to 'main' is forbidden. Please create a feature branch and open a PR."
                  exit 1
                fi
